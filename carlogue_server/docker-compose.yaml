services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: carlogue
      POSTGRES_PASSWORD: "dCSMFeRRzni9m7vLIXWig5DQxFjYo0Ot"
    volumes:
      - carlogue_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "QsYihv2XJ3JrIav41mwT3QPWOKv9yKI_"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: carlogue_test
      POSTGRES_PASSWORD: "zxFkT9S5cY_RYi8DURKAUu8UIVkmok5X"
    volumes:
      - carlogue_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "IJzu7W4Ak7Re0_JMHskOYZKucptZIVEe"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  carlogue_data:
  carlogue_test_data:
